<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 400px; margin: 0; font: 13px system-ui, sans-serif; background: #1e1e24; color: #eee; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid #333; }
    header b { font-size: 14px; }
    .speeds { color: #aaa; font-size: 12px; }
    .tabs { display: flex; gap: 4px; padding: 8px 12px 0; }
    .tabs button { background: none; border: 0; color: #999; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
    .tabs button.on { background: #2b2b33; color: #fff; }
    #list { max-height: 420px; overflow-y: auto; padding: 4px 12px 8px; }
    .t { padding: 8px 0; border-bottom: 1px solid #2a2a30; }
    .row { display: flex; align-items: center; gap: 8px; }
    .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn { background: #2b2b33; border: 0; color: #eee; border-radius: 6px; width: 26px; height: 24px; cursor: pointer; }
    .btn:hover { background: #3a3a44; }
    .bar { height: 4px; background: #2b2b33; border-radius: 2px; margin: 6px 0 4px; overflow: hidden; }
    .bar div { height: 100%; background: #3b82f6; }
    .bar div.done { background: #22c55e; } .bar div.paused { background: #6b7280; } .bar div.err { background: #ef4444; }
    .meta { color: #999; font-size: 11px; }
    .empty, .error { color: #999; padding: 20px 0; text-align: center; }
    .error { color: #ff7b72; white-space: pre-wrap; }
    footer { display: flex; justify-content: space-between; padding: 8px 12px; border-top: 1px solid #333; }
    footer a { color: #60a5fa; text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <header><b>qBittorrent</b><span class="speeds" id="speeds"></span></header>
  <div class="tabs">
    <button data-tab="active" class="on">En cours</button>
    <button data-tab="done">Terminés récents</button>
  </div>
  <div id="list"><div class="empty">Chargement…</div></div>
  <footer><a id="open">Ouvrir qBittorrent</a><a id="options">Options</a></footer>
  <script src="popup.js"></script>
</body>
</html>
